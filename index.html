<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jeremy Walton — software craftsman. Bio, projects, and a curated reading list." />
    <meta name="color-scheme" content="light dark" />
    <title>Jeremy Walton</title>
    <script>
      // Only a stored override needs applying before paint — with no attribute,
      // `color-scheme: light dark` already follows the system preference.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.dataset.themeMode = stored;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript><p style="padding: 2rem">This site needs JavaScript to run.</p></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
